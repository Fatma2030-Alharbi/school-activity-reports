
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار التوقيع الإلكتروني</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Tahoma,Arial,sans-serif;max-width:700px;margin:20px auto;padding:16px;background:#f4f7f6;color:#193a36;line-height:1.8}
.panel{background:white;border:1px solid #dce7e2;border-radius:14px;padding:16px;margin:16px 0}
input,button{font:inherit;padding:10px;border-radius:8px;margin:5px 0}
input{width:100%;box-sizing:border-box;border:1px solid #b9cbc4}
button{border:0;background:#176b5b;color:white;padding:10px 18px;cursor:pointer}
.secondary{background:#e7f1ed;color:#193a36}
#pad{width:100%;height:220px;display:block;border:2px dashed #8aa9a0;border-radius:10px;touch-action:none;background:white}
#status,#authStatus{overflow-wrap:anywhere}
</style>
</head>
<body>
<h2>التوقيع الإلكتروني للمعلمة</h2>
<p>صفحة اختبار مستقلة لمنصة تقارير النشاط الطلابي.</p>

<section class="panel">
<h3>تسجيل الدخول</h3>
<label for="email">البريد الإلكتروني</label>
<input id="email" type="email" autocomplete="username">
<label for="password">كلمة المرور</label>
<input id="password" type="password" autocomplete="current-password">
<button id="login">تسجيل الدخول</button>
<button id="logout" class="secondary">تسجيل الخروج</button>
<p id="authStatus">يرجى تسجيل الدخول.</p>
</section>

<section class="panel">
<h3>ارسمي توقيعك بإصبعك</h3>
<canvas id="pad"></canvas>
<button id="save">حفظ توقيعي</button>
<button id="clear" class="secondary">مسح التوقيع</button>
<p id="status">سجّلي الدخول أولًا.</p>
</section>

<script>
const SUPABASE_URL='https://esdzituynhifkhcrropa.supabase.co';
const SUPABASE_KEY='sb_publishable_VRrquXOi_Omvixuxt-3EqQ_ozob4cKD';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
const canvas=$('pad');
const ctx=canvas.getContext('2d');
let user=null, drawing=false, hasInk=false;

function resizeCanvas(){
  const old=hasInk?canvas.toDataURL('image/png'):null;
  const rect=canvas.getBoundingClientRect();
  const scale=window.devicePixelRatio||1;
  canvas.width=Math.round(rect.width*scale);
  canvas.height=Math.round(220*scale);
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.lineWidth=2.5;
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.strokeStyle='#193a36';
  if(old){
    const img=new Image();
    img.onload=()=>ctx.drawImage(img,0,0,rect.width,220);
    img.src=old;
  }
}

function point(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}

canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  drawing=true;
  hasInk=true;
  canvas.setPointerCapture(e.pointerId);
  const p=point(e);
  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
});

canvas.addEventListener('pointermove',e=>{
  if(!drawing)return;
  e.preventDefault();
  const p=point(e);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
});

function stopDrawing(){
  drawing=false;
  ctx.closePath();
}
canvas.addEventListener('pointerup',stopDrawing);
canvas.addEventListener('pointercancel',stopDrawing);

function clearSignature(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  hasInk=false;
}

async function loadSignature(){
  const {data:{session}}=await db.auth.getSession();
  user=session?session.user:null;
  $('authStatus').textContent=user
    ?'تم تسجيل الدخول: '+user.email
    :'لم يتم تسجيل الدخول.';
  if(!user){
    $('status').textContent='سجّلي الدخول أولًا.';
    return;
  }
  const {data,error}=await db.from('user_signatures')
    .select('signature_data')
    .eq('user_id',user.id)
    .maybeSingle();

  if(error){
    $('status').textContent='تعذر تحميل التوقيع: '+error.message;
    return;
  }
  clearSignature();
  if(data&&data.signature_data){
    const img=new Image();
    img.onload=()=>{
      ctx.drawImage(img,0,0,canvas.clientWidth,220);
      hasInk=true;
    };
    img.src=data.signature_data;
    $('status').textContent='عُثر على توقيع محفوظ لهذا الحساب.';
  }else{
    $('status').textContent='لا يوجد توقيع محفوظ؛ يمكنك رسم توقيع جديد.';
  }
}

$('login').onclick=async()=>{
  const email=$('email').value.trim();
  const password=$('password').value;
  if(!email||!password){
    $('authStatus').textContent='أدخلي البريد الإلكتروني وكلمة المرور.';
    return;
  }
  $('login').disabled=true;
  const {error}=await db.auth.signInWithPassword({email,password});
  $('login').disabled=false;
  if(error){
    $('authStatus').textContent='تعذر تسجيل الدخول: '+error.message;
    return;
  }
  await loadSignature();
};

$('logout').onclick=async()=>{
  await db.auth.signOut();
  user=null;
  clearSignature();
  $('authStatus').textContent='تم تسجيل الخروج.';
  $('status').textContent='سجّلي الدخول أولًا.';
};

$('clear').onclick=()=>{
  clearSignature();
  $('status').textContent='تم مسح اللوحة. ارسمي توقيعك من جديد.';
};

$('save').onclick=async()=>{
  if(!user){
    $('status').textContent='سجّلي الدخول أولًا.';
    return;
  }
  if(!hasInk){
    $('status').textContent='ارسمي توقيعك قبل الحفظ.';
    return;
  }
  $('save').disabled=true;
  $('status').textContent='جارٍ حفظ التوقيع...';
  const {error}=await db.from('user_signatures').upsert({
    user_id:user.id,
    signature_data:canvas.toDataURL('image/png'),
    updated_at:new Date().toISOString()
  },{onConflict:'user_id'});
  $('save').disabled=false;
  $('status').textContent=error
    ?'تعذر الحفظ: '+error.message
    :'تم حفظ التوقيع بنجاح في حسابك.';
};

window.addEventListener('resize',resizeCanvas);
resizeCanvas();
loadSignature();
</script>
</body>
</html>
