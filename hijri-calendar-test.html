
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التقويم الهجري التجريبي</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7f6;color:#183d35;margin:0;padding:20px}
.card{max-width:520px;margin:20px auto;background:white;padding:22px;border-radius:18px;box-shadow:0 4px 18px #0001}
h2{text-align:center}
p{text-align:center;color:#52645e}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 0}
button{border:0;border-radius:9px;background:#176b55;color:white;padding:10px 14px;font-size:16px;cursor:pointer}
#monthTitle{font-weight:bold;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{text-align:center;padding:10px 0;border-radius:8px}
.week{font-size:12px;color:#66736e;font-weight:bold}
.day{background:#f0f5f2;color:#183d35}
.day:hover{background:#d4e9df}
.day.selected{background:#176b55;color:white}
.day.today{outline:2px solid #b68a36}
.empty{background:transparent}
.result{margin-top:20px;padding:15px;background:#edf5f0;border-radius:12px;text-align:center;line-height:2}
.small{font-size:13px;color:#61716b}
</style>
</head>
<body>
<div class="card">
<h2>التقويم الهجري</h2>
<p>تقويم أم القرى — تجربة مستقلة</p>

<div class="nav">
<button id="prev" type="button">الشهر السابق</button>
<div id="monthTitle"></div>
<button id="next" type="button">الشهر التالي</button>
</div>

<div class="grid" id="calendar"></div>

<div class="result">
<div>التاريخ الهجري المختار</div>
<strong id="hijriResult">اختاري يومًا من التقويم</strong>
<div>الموافق ميلاديًا</div>
<strong id="gregResult">—</strong>
</div>
<p class="small">هذه صفحة اختبار فقط، ولا تحفظ أي بيانات في منصة التقارير.</p>
</div>

<script>
const hijri = new Intl.DateTimeFormat(
  'en-u-ca-islamic-umalqura-nu-latn',
  {day:'numeric',month:'numeric',year:'numeric'}
);
const hijriArabic = new Intl.DateTimeFormat(
  'ar-SA-u-ca-islamic-umalqura',
  {day:'numeric',month:'long',year:'numeric'}
);
const gregArabic = new Intl.DateTimeFormat(
  'ar-SA-u-nu-latn',
  {day:'numeric',month:'numeric',year:'numeric'}
);
const weekdays=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const months=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];

function parts(date){
  const p={};
  hijri.formatToParts(date).forEach(x=>{if(x.type!=='literal')p[x.type]=Number(x.value)});
  return p;
}

function monthStart(y,m){
  const start = Date.UTC(y + 577, 0, 1);
  const end = Date.UTC(y + 580, 0, 1);

  for(let t = start; t < end; t += 86400000){
    const d = new Date(t);
    const p = parts(d);

    if(p.year === y && p.month === m && p.day === 1){
   return new Date(Date.UTC(
  d.getUTCFullYear(),
  d.getUTCMonth(),
  d.getUTCDate()
));
    }
  }

  return null;
}

const today=new Date();
let current=parts(today);
let viewYear=current.year,viewMonth=current.month;
let selected=today;

function moveMonth(delta){
  const start = monthStart(viewYear, viewMonth);
  if (!start) return;

  const offset = delta > 0 ? 35 : -1;
  const target = new Date(start.getTime() + offset * 86400000);
  const p = parts(target);

  viewYear = p.year;
  viewMonth = p.month;
  render();
}
function render(){
  const start=monthStart(viewYear,viewMonth);
  const cal=document.getElementById('calendar');
  cal.innerHTML='';
  document.getElementById('monthTitle').textContent=
    months[viewMonth-1]+' '+viewYear+' هـ';

  weekdays.forEach(w=>{
    const el=document.createElement('div');
    el.className='cell week';el.textContent=w;cal.appendChild(el);
  });

  if(!start){cal.textContent='تعذر عرض هذا الشهر على هذا الجهاز.';return}
  let d=new Date(start);
  let p=parts(d);
  for(let i=0;i<d.getUTCDay();i++){
    const el=document.createElement('div');el.className='cell empty';cal.appendChild(el);
  }
  while(p.year===viewYear&&p.month===viewMonth){
    const dayDate=new Date(d);
    const el=document.createElement('button');
    el.type='button';el.className='cell day';
    el.textContent=p.day;
    if(dayDate.toDateString()===today.toDateString())el.classList.add('today');
    if(selected&&dayDate.toDateString()===selected.toDateString())el.classList.add('selected');
    el.addEventListener('click',()=>{
      selected=dayDate;
      document.getElementById('hijriResult').textContent=hijriArabic.format(dayDate);
      document.getElementById('gregResult').textContent=gregArabic.format(dayDate);
      render();
    });
    cal.appendChild(el);
    d=new Date(d.getTime()+86400000);
    p=parts(d);
  }
  if(selected){
    document.getElementById('hijriResult').textContent=hijriArabic.format(selected);
    document.getElementById('gregResult').textContent=gregArabic.format(selected);
  }
}
document.getElementById('prev').addEventListener('click',()=>moveMonth(-1));
document.getElementById('next').addEventListener('click',()=>moveMonth(1));
render();
</script>
</body>
</html>
